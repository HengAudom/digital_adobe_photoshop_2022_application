<!doctype html>
<!--
  Template for the link-preview image (images/og-image.jpg) shown when the site link is
  shared on Telegram, Facebook, Messenger, etc.
-->
<html lang="km">

<head>
  <meta charset="utf-8">
  <title>Share image - Adobe Photoshop 2022</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Work+Sans:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: 'Work Sans', 'Kantumruy Pro', sans-serif;
      color: #f8fafc;
      background:
      radial-gradient(circle at 88% 18%, rgba(49, 168, 255, .35), transparent 45%),
      radial-gradient(circle at 10% 100%, rgba(13, 148, 136, .25), transparent 42%),
      linear-gradient(135deg, #000c18 0%, #001e36 50%, #002b4d 100%);
      display: flex;
      align-items: center;
      padding: 0 72px;
      box-sizing: border-box;
      gap: 56px;
    }

    .text {
      flex: 1;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(49, 168, 255, .35);
      font: 600 22px 'Kantumruy Pro', sans-serif;
      color: #bae6fd;
    }

    .badge i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #31a8ff;
      display: block;
      box-shadow: 0 0 10px #31a8ff;
    }

    h1 {
      font: 700 60px/1.3 'Kantumruy Pro', sans-serif;
      margin: 20px 0 6px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }


    .en {
      font: 600 30px 'Work Sans', sans-serif;
      color: #38bdf8;
      margin: 0 0 28px;
    }

    .apps {
      display: flex;
      gap: 14px;
      margin-bottom: 30px;
    }

    .app {
      font: 700 22px 'Work Sans', sans-serif;
      padding: 10px 22px;
      border-radius: 12px;
      color: #fff;
    }


    .ps-badge {
      background: #001e36;
      border: 2px solid #31a8ff;
      color: #31a8ff;
    }

    .design-badge {
      background: #0284c7;
    }

    .retouch-badge {
      background: #0d9488;
    }

    .meta {
      font: 600 23px 'Kantumruy Pro', sans-serif;
      color: #e2e8f0;
    }

    .meta span {
      color: #93c5fd;
    }

    .logo {
      width: 300px;
      height: 300px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 0 10px rgba(49, 168, 255, .2);
    }

    .logo img {
      width: 280px;
      height: 280px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="text">
    <div class="badge"><i></i>វេទិកាសិក្សាឌីជីថល • ៥ ជំពូក • ១៨ មេរៀន & ឧបសម្ព័ន្ធ</div>
    <h1>ការរចនាក្រាហ្វិក<br>និងកាត់តរូបភាព</h1>
    <p class="en">Basic Adobe Photoshop 2022</p>
    <div class="apps">
      <div class="app ps-badge">Photoshop 2022</div>
      <div class="app design-badge">Graphic Design</div>
      <div class="app retouch-badge">Photo Retouching</div>
    </div>
    <div class="meta">វិទ្យាស្ថានពហុបច្ចេកទេសភូមិភាគតេជោសែនសៀមរាប <span>(RPITSSR)</span></div>
  </div>
  <div class="logo"><img src="../images/logo.webp" alt="RPITSSR Logo"></div>
</body>

</html>
